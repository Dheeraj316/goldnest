name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: lending_platform_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d lending_platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://platform:platform@localhost:5432/lending_platform_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-please-change-32chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-please-change-32chars

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run migrations
        run: npm run prisma:migrate:deploy

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --coverage

      - name: E2E tests
        run: npm run test:e2e
